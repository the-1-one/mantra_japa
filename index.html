<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>मन्त्र जप काउन्टर — विधि चक्र</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#060300;font-family:'Noto Sans Devanagari',serif;overflow-x:hidden;}
body{min-height:100vh;}
input,textarea,button{font-family:'Noto Sans Devanagari',serif;outline:none;}
input[type=range]{width:100%;cursor:pointer;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}
#setup{display:flex;flex-direction:column;align-items:center;padding:32px 18px 120px;}
.card{width:100%;max-width:440px;border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:20px;}
.field-label{display:block;font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-weight:600;}
.inp{width:100%;border-radius:10px;padding:11px 13px;font-size:16px;border-width:1px;border-style:solid;}
textarea.inp{resize:vertical;line-height:1.75;font-size:18px;}
.preset-btn{border-radius:20px;padding:4px 13px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid;transition:all 0.2s;background:transparent;}
.count-btn{border-radius:20px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer;border-width:1px;border-style:solid;transition:all 0.2s;background:transparent;}
.theme-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border-width:2.5px;border-style:solid;transition:all 0.2s;}
.mode-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;border-width:1px;border-style:solid;transition:all 0.2s;margin-bottom:8px;}
.radio-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;border-width:2px;border-style:solid;transition:all 0.2s;}
.sz-btn{flex:1;padding:10px 0;border-radius:12px;font-weight:700;cursor:pointer;border-width:1px;border-style:solid;transition:all 0.2s;background:transparent;}
.img-thumb{position:relative;width:68px;height:68px;border-radius:10px;overflow:hidden;border-width:1px;border-style:solid;flex-shrink:0;}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.del-btn{position:absolute;inset:0;background:rgba(0,0,0,0.62);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.2s;font-size:20px;color:#FF6B6B;}
.img-thumb:hover .del-btn{opacity:1;}
.add-btn{width:68px;height:68px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;border-width:1px;border-style:dashed;flex-shrink:0;}
.toggle-track{width:46px;height:26px;border-radius:13px;cursor:pointer;position:relative;transition:all 0.3s;border-width:1px;border-style:solid;flex-shrink:0;}
.toggle-thumb{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;transition:all 0.3s;}
.go-btn{border:none;border-radius:40px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all 0.3s;width:100%;}
#sticky-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,#060300 60%,rgba(6,3,0,0.85) 85%,transparent);display:none;justify-content:center;}
#sticky-bar button{width:100%;max-width:440px;border:none;border-radius:40px;padding:16px;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:1px;font-family:'Noto Sans Devanagari',serif;}
.upload-zone{border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;border-width:1px;border-style:dashed;}
.wm-zone{border-radius:10px;text-align:center;cursor:pointer;border-width:1px;border-style:dashed;overflow:hidden;}
.option-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
.fx-card{padding:10px 12px;border-radius:12px;cursor:pointer;border-width:1px;border-style:solid;transition:all 0.2s;display:flex;align-items:center;gap:10px;}
.fx-icon{font-size:18px;width:30px;text-align:center;flex-shrink:0;}
.preset-slot{padding:10px 12px;border-radius:10px;border:1px solid;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;}
#player{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;}
#cv{max-width:100%;max-height:100vh;display:block;touch-action:none;}
#player-controls{position:absolute;bottom:0;left:0;right:0;z-index:31;display:none;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:16px 12px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);}
.pc-btn{border-radius:30px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid rgba(255,215,0,0.4);color:#FFD700;background:rgba(0,0,0,0.5);font-family:'Noto Sans Devanagari',serif;}
.pc-round{border-radius:50%;width:46px;height:46px;font-size:18px;padding:0;}
#export-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.92);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;}
#guide-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;}
</style>
</head>
<body>

<div id="setup"></div>
<div id="sticky-bar"><button id="sticky-go" onclick="startPlayer()">▶ PREVIEW</button></div>

<div id="player">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="player-controls">
    <div id="pc-play" class="pc-btn pc-round" onclick="togglePlay(event)">⏸</div>
    <button class="pc-btn pc-round" onclick="resetPlayer(event)">↺</button>
    <button id="pc-export" class="pc-btn" onclick="openExport(event)">⬇ Save MP4</button>
    <button class="pc-btn pc-round" onclick="showGuide(event)">?</button>
    <button class="pc-btn pc-round" onclick="exitPlayer(event)">⚙</button>
  </div>
</div>

<div id="export-overlay"></div>
<div id="guide-modal" onclick="hideGuide()"></div>
<audio id="bhajan-audio" loop style="display:none;"></audio>

    // ── Candidates to offer: the pulse and its groupings ──
    const cset=[];
    for(const k of [1,2,3,4,6,8]){
      const s=Math.round(period*k*100)/100;
      if(s<=Math.max(20,sAudioDuration)&&!cset.some(q=>Math.abs(q.sec-s)<0.15)){
        const pk=peakNear(s,0.03);
        cset.push({sec:s,val:pk?pk.val:0});
      }
    }
    anCandidates=cset.slice(0,6);
    sSyncPeriod=Math.round(period*100)/100;
    sSyncOffset=findOffset(sSyncPeriod);
    anDone=true;
  }catch(err){
    console.log('scan error',err);
    alert('Could not analyze this audio file.\n\nTry a different format (MP3/WAV/M4A), or set the timing manually.');
  }
  anScanning=false;
  renderSetup();
  setTimeout(drawWaveform,50);
}

// Find where the first mantra starts: the phase that best lines up with onset energy
function findOffset(period){
  if(!anFlux||!period)return 0;
  const Pf=Math.max(1,Math.round(period/anFrameDur));
  const n=anFlux.length;
  let bestO=0,bestScore=-1;
  for(let o=0;o<Pf;o++){
    let s=0,c=0;
    for(let k=o;k<n;k+=Pf){s+=anFlux[k];c++;}
    if(c===0)continue;
    const score=s/c;
    if(score>bestScore){bestScore=score;bestO=o;}
  }
  return Math.round(bestO*anFrameDur*100)/100;
}
function repickOffset(){sSyncOffset=findOffset(sSyncPeriod);renderSetup();setTimeout(drawWaveform,50);}

// ── Waveform + tick overlay ──
function drawWaveform(){
  const cv=el('wave-cv');
  if(!cv||!anEnv)return;
  const P=theme().p;
  const dpr=window.devicePixelRatio||1;
  const cssW=cv.clientWidth||360,cssH=110;
  cv.width=cssW*dpr;cv.height=cssH*dpr;
  cv.style.height=cssH+'px';
  const c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,cssW,cssH);
  c.fillStyle='rgba(255,255,255,0.03)';c.fillRect(0,0,cssW,cssH);

  // show a window: 4 periods (or 12s) so ticks are clearly visible
  const winSec=Math.min(sAudioDuration||12,Math.max(8,(sSyncPeriod||4)*4));
  const frames=Math.min(anEnv.length,Math.floor(winSec/anFrameDur));
  let mx=0.0001;for(let i=0;i<frames;i++)mx=Math.max(mx,anEnv[i]);

  // envelope
  c.beginPath();
  for(let x=0;x<cssW;x++){
    const fi=Math.floor(x/cssW*frames);
    const v=anEnv[fi]/mx;
    const y=cssH-4-v*(cssH-16);
    if(x===0)c.moveTo(x,y);else c.lineTo(x,y);
  }
  c.strokeStyle=gC(P,0.55);c.lineWidth=1.5;c.stroke();
  c.lineTo(cssW,cssH);c.lineTo(0,cssH);c.closePath();
  c.fillStyle=gC(P,0.10);c.fill();

  // tick lines at offset + k*period
  if(sSyncPeriod>0){
    let k=0;
    while(true){
      const t=sSyncOffset+k*sSyncPeriod;
      if(t>winSec)break;
      if(t>=0){
        const x=t/winSec*cssW;
        c.beginPath();c.moveTo(x,0);c.lineTo(x,cssH);
        c.strokeStyle=k===0?'#4ade80':gC(P,0.85);
        c.lineWidth=k===0?2.5:1.8;c.stroke();
        c.fillStyle=k===0?'#4ade80':gC(P,0.85);
        c.beginPath();c.arc(x,7,4,0,Math.PI*2);c.fill();
      }
      k++;
      if(k>60)break;
    }
  }
  // legend
  c.fillStyle='rgba(255,255,255,0.35)';
  c.font='10px monospace';
  c.fillText('0s',3,cssH-3);
  c.textAlign='right';c.fillText(winSec.toFixed(1)+'s',cssW-3,cssH-3);
  c.textAlign='left';
}

// ── Audition: play audio with a click at every tick ──
let auditionStop=null;
function testSync(){
  if(auditionStop){auditionStop();return;}
  const ac=getAC();
  if(ac.state==='suspended')ac.resume();
  const audio=el('bhajan-audio');
  audio.currentTime=0;
  audio.play().catch(()=>{});
  const t0=ac.currentTime+0.08;
  const limit=Math.min(sAudioDuration||20,20);
  const oscs=[];
  for(let t=sSyncOffset;t<limit;t+=sSyncPeriod){
    if(t<0)continue;
    const osc=ac.createOscillator(),g=ac.createGain();
    osc.frequency.value=1400;osc.type='sine';
    const at=t0+t;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(0.35,at+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,at+0.07);
    osc.connect(g);g.connect(ac.destination);
    osc.start(at);osc.stop(at+0.09);
    oscs.push(osc);
  }
  const btn=el('test-btn');
  if(btn){btn.textContent='⏹ Stop test';btn.style.background='rgba(255,100,100,0.15)';}
  auditionStop=()=>{
    oscs.forEach(o=>{try{o.stop();}catch(e){}});
    audio.pause();audio.currentTime=0;
    const b=el('test-btn');
    if(b){b.textContent='🔊 Test sync (audio + click)';b.style.background='';}
    auditionStop=null;
  };
  setTimeout(()=>{if(auditionStop)auditionStop();},limit*1000+300);
}

// ── Manual fine-tune ──
function nudgePeriod(d){
  sSyncPeriod=Math.max(0.5,Math.round((sSyncPeriod+d)*100)/100);
  renderSetup();setTimeout(drawWaveform,50);
}
function nudgeOffset(d){
  sSyncOffset=Math.round((sSyncOffset+d)*100)/100;
  renderSetup();setTimeout(drawWaveform,50);
}
function pickCandidate(sec){
  sSyncPeriod=Math.round(sec*100)/100;
  sSyncOffset=findOffset(sSyncPeriod);
  renderSetup();setTimeout(drawWaveform,50);
}

// ── Tap-to-mark fallback ──
let tapTimes=[];
function tapBeat(){
  const audio=el('bhajan-audio');
  if(audio.paused){audio.currentTime=0;audio.play().catch(()=>{});tapTimes=[];}
  tapTimes.push(audio.currentTime);
  if(tapTimes.length>=2){
    const iv=[];
    for(let i=1;i<tapTimes.length;i++)iv.push(tapTimes[i]-tapTimes[i-1]);
    iv.sort((a,b)=>a-b);
    const med=iv[Math.floor(iv.length/2)];
    sSyncPeriod=Math.round(med*100)/100;
    sSyncOffset=Math.round(tapTimes[0]*100)/100;
  }
  const b=el('tap-btn');
  if(b)b.textContent=`👆 Tapped ${tapTimes.length}× ${sSyncPeriod?'— '+sSyncPeriod.toFixed(2)+'s':''}`;
  renderSetup2Wave();
}
function renderSetup2Wave(){setTimeout(drawWaveform,30);}
function resetTaps(){tapTimes=[];el('bhajan-audio').pause();renderSetup();}

// ═══════════ CANVAS ENGINE ═══════════
const W=1080,H=1920;
let ctx=null,rafId=null,playing=false;
let startClock=0,pausedAt=0,totalElapsed=0;
let petals=[],lastBurstJap=-1;

const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOut=t=>1-Math.pow(1-t,3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// One jap = the scanned/locked sync period when audio is loaded, else the slider value
function japDur(){
  if(sAudioSrc&&sSyncPeriod>0.3)return sSyncPeriod;
  return sSpeed;
}
function syncOffset(){return (sAudioSrc&&sSyncPeriod>0.3)?sSyncOffset:0;}

function startPlayer(){
  if(!sMantra.trim())return;
  sDeity=el('inp-deity')?el('inp-deity').value:sDeity;
  sMantra=el('inp-mantra')?el('inp-mantra').value:sMantra;
  if(!sMantra.trim())return;
  el('setup').style.display='none';
  el('sticky-bar').style.display='none';
  el('player').style.display='flex';
  ctx=el('cv').getContext('2d');
  totalElapsed=0;pausedAt=0;petals=[];lastBurstJap=-1;
  if(sAudioSrc)el('bhajan-audio').currentTime=0;
  fitCanvas();
  drawFrame(0);
  if(sAuto)play();else{playing=false;showPC();}
  updatePCPlay();
}
function fitCanvas(){
  const cv=el('cv');
  const scale=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
}
window.addEventListener('resize',()=>{if(el('player').style.display==='flex')fitCanvas();});

let audioLoops=0,lastAudioTime=0;

function play(){
  playing=true;
  startClock=performance.now()/1000-pausedAt;
  if(sAudioSrc){
    const a=el('bhajan-audio');
    a.play().catch(()=>{});
  }
  loop();updatePCPlay();
}
function pause(){
  playing=false;pausedAt=totalElapsed;
  if(sAudioSrc)el('bhajan-audio').pause();
  if(rafId)cancelAnimationFrame(rafId);
  updatePCPlay();
}
function togglePlay(e){if(e)e.stopPropagation();playing?pause():play();showPC();}
function resetPlayer(e){
  if(e)e.stopPropagation();pause();
  totalElapsed=0;pausedAt=0;petals=[];lastBurstJap=-1;
  audioLoops=0;lastAudioTime=0;
  if(sAudioSrc)el('bhajan-audio').currentTime=0;
  drawFrame(0);showPC();
}

// THE KEY: when audio is loaded, the AUDIO is the clock.
// The counter reads its position directly, so they physically cannot drift.
function loop(){
  if(!playing)return;
  const a=el('bhajan-audio');
  if(sAudioSrc&&sSyncPeriod>0.3&&!a.paused&&sAudioDuration>0){
    const ct=a.currentTime;
    if(ct<lastAudioTime-0.5)audioLoops++;   // file looped back to start
    lastAudioTime=ct;
    totalElapsed=audioLoops*sAudioDuration+ct;
    pausedAt=totalElapsed;
  } else {
    totalElapsed=performance.now()/1000-startClock;
  }
  drawFrame(totalElapsed);
  rafId=requestAnimationFrame(loop);
}

// ═══════════ drawFrame(t): fully deterministic ═══════════
function drawFrame(t){
  if(!ctx)return;
  const T=theme(),P=T.p,S=T.s;
  const jd=japDur();
  const tAdj=Math.max(0,t-syncOffset());   // wait for the first mantra to begin
  const japIndex=Math.floor(tAdj/jd);
  const inJap=(tAdj%jd)/jd;
  const total=totalN();
  const curN=japIndex%total;
  const malas=Math.floor(japIndex/total);
  const words=cWords();

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#060300";ctx.fillRect(0,0,W,H);

  // Deity image + Ken Burns
  if(imageObjs.length>0){
    const idx=imageObjs.length>1?Math.floor(t/sImgInt)%imageObjs.length:0;
    const img=imageObjs[idx];
    if(img){
      const prog=(t%sImgInt)/sImgInt;
      drawKenBurns(img,prog);
      // crossfade next image in last 0.8s
      if(imageObjs.length>1){
        const fadeT=(t%sImgInt);
        if(fadeT>sImgInt-0.8){
          const nxt=imageObjs[(idx+1)%imageObjs.length];
          if(nxt){ctx.save();ctx.globalAlpha=(fadeT-(sImgInt-0.8))/0.8*0.85;drawKenBurnsRaw(nxt,0);ctx.restore();}
        }
      }
    }
  }
  // gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  if(imageObjs.length>0){
    grad.addColorStop(0,"rgba(6,3,0,0.05)");grad.addColorStop(0.4,"rgba(6,3,0,0.08)");
    grad.addColorStop(0.60,"rgba(6,3,0,0.72)");grad.addColorStop(1,"rgba(6,3,0,0.97)");
  }else{grad.addColorStop(0,"rgba(10,5,0,0.4)");grad.addColorStop(1,"rgba(6,3,0,0.6)");}
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  updateAndDrawPetals(t,P,S);

  // mala completion burst
  if(japIndex>0&&curN===0&&japIndex!==lastBurstJap&&inJap<0.5){lastBurstJap=japIndex;}
  if(lastBurstJap>0){
    const burstStart=lastBurstJap*jd;
    const bt=(t-burstStart)/0.8;
    if(bt>=0&&bt<1){
      ctx.save();ctx.globalAlpha=1-bt;
      ctx.strokeStyle=P;ctx.lineWidth=5;ctx.shadowColor=P;ctx.shadowBlur=30;
      ctx.beginPath();ctx.arc(W/2,H*0.60,140+bt*420,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }

  drawWatermark(P);
  if(sImages.length>1)drawImgDots(Math.floor(t/sImgInt)%sImages.length,P);

  if(sShowCounter){
    const ringCY=H*0.62;
    drawRing(W/2,ringCY,curN,total,inJap,P,S,t);
    drawCounterNumber(W/2,ringCY,curN,total,inJap,P,t);
    drawMantra(W/2,H*0.38,t,inJap,curN,words,P,S);
    if(malas>0)drawMala(W/2,ringCY+310,malas,S);
    drawOm(W/2,H*0.26,t,P);
    if(sDeity)drawDeity(W/2,H*0.26+90,P);
  } else {
    drawMantra(W/2,H*0.55,t,inJap,curN,words,P,S);
    drawOm(W/2,H*0.38,t,P);
    if(sDeity)drawDeity(W/2,H*0.38+95,P);
  }
}

// ═══════════ DRAW HELPERS ═══════════
function drawKenBurnsRaw(img,prog){
  const ir=img.width/img.height,cr=W/H;
  let dw,dh;
  if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;}
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
}
function drawKenBurns(img,prog){
  const ir=img.width/img.height,cr=W/H;
  let dw,dh;
  if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;}
  let scale=1,ox=0;
  const amt=0.18;
  if(sPhotoFx==='zoomin')scale=1+amt*prog;
  else if(sPhotoFx==='zoomout')scale=1+amt*(1-prog);
  else if(sPhotoFx==='panlr'){scale=1.15;ox=(prog-0.5)*W*0.12;}
  else scale=1.02;
  dw*=scale;dh*=scale;
  ctx.save();ctx.globalAlpha=0.85;
  ctx.drawImage(img,(W-dw)/2+ox,(H-dh)/2,dw,dh);
  ctx.restore();
}

function drawOm(cx,cy,t,P){
  const breathe=1+0.08*Math.sin(t*1.5);
  const sz=(sShowCounter?78:104)*breathe;
  ctx.save();
  ctx.font=`900 ${sz}px 'Noto Sans Devanagari',serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=P;ctx.shadowColor=P;ctx.shadowBlur=30+10*Math.sin(t*1.5);
  ctx.fillText('ॐ',cx,cy);
  ctx.restore();
}
function drawDeity(cx,cy,P){
  ctx.save();
  ctx.font=`700 30px 'Noto Sans Devanagari',serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=gC(P,0.65);
  ctx.fillText(sDeity,cx,cy);
  ctx.restore();
}

function fxTransform(fx,k,t){
  let scale=1,dy=0,alpha=1,blur=0;
  if(fx==='slam'){const e=easeOutBack(clamp(k,0,1));scale=0.4+0.6*e;dy=20*(1-k);alpha=clamp(k*2.5,0,1);blur=6*(1-clamp(k*2,0,1));}
  else if(fx==='fade'){alpha=clamp(k,0,1);scale=0.96+0.04*clamp(k,0,1);}
  else if(fx==='zoom'){const e=easeOutBack(clamp(k,0,1));scale=0.1+0.9*e;alpha=clamp(k*2.5,0,1);blur=10*(1-clamp(k*1.5,0,1));}
  else if(fx==='rise'){const e=easeOut(clamp(k,0,1));dy=70*(1-e);alpha=clamp(k*1.6,0,1);}
  else if(fx==='fall'){const e=easeOut(clamp(k,0,1));dy=-70*(1-e);alpha=clamp(k*1.6,0,1);blur=4*(1-clamp(k*1.4,0,1));}
  else if(fx==='divine'){const e=easeOut(clamp(k,0,1));scale=0.7+0.3*e+0.03*Math.sin(t*4);alpha=clamp(k*1.8,0,1);blur=8*(1-clamp(k*1.5,0,1));}
  else if(fx==='flicker'){
    // deterministic flicker from k
    if(k<0.6){const ph=Math.floor(k*20);alpha=(ph%3===1)?0.25:1;}else alpha=1;
  }
  return{scale,dy,alpha,blur};
}

function drawMantra(cx,cy,t,inJap,curN,words,P,S){
  const f=fsz();
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';

  if(sTextMode==='full'){
    const k=clamp(inJap/0.3,0,1);
    const tr=fxTransform(sTextFx,k,t);
    ctx.globalAlpha=tr.alpha;
    if(tr.blur>0.3)ctx.filter=`blur(${tr.blur}px)`;
    ctx.translate(cx,cy+tr.dy);ctx.scale(tr.scale,tr.scale);
    ctx.font=`800 ${f.mantra}px 'Noto Sans Devanagari',serif`;
    ctx.fillStyle=P;ctx.shadowColor=P;ctx.shadowBlur=30;
    wrapText(sMantra,0,0,W*0.85,f.mantra*1.35);
  }
  else if(sTextMode==='word'&&words.length>0){
    const wordDur=1/words.length;
    const wi=Math.min(words.length-1,Math.floor(inJap/wordDur));
    const wp=(inJap-wi*wordDur)/wordDur;
    const k=clamp(wp/0.4,0,1);
    const w=words[wi]||'';
    const sz=w.length>7?f.mantra*1.1:w.length>4?f.mantra*1.35:f.mantra*1.65;
    const tr=fxTransform(sTextFx,k,t);
    ctx.globalAlpha=tr.alpha;
    if(tr.blur>0.3)ctx.filter=`blur(${tr.blur}px)`;
    ctx.translate(cx,cy+tr.dy);ctx.scale(tr.scale,tr.scale);
    ctx.font=`900 ${sz}px 'Noto Sans Devanagari',serif`;
    ctx.fillStyle=P;ctx.shadowColor=P;ctx.shadowBlur=45;
    ctx.fillText(w,0,0);
  }
  else if(words.length>0){ // build
    const wordDur=1/(words.length+0.5);
    const shown=Math.max(1,Math.min(words.length,Math.floor(inJap/wordDur)+1));
    const baseSz=words.length>6?f.mantra*0.62:f.mantra*0.8;
    ctx.font=`700 ${baseSz}px 'Noto Sans Devanagari',serif`;
    const gap=baseSz*0.42;
    const visible=words.slice(0,shown);
    const widths=visible.map(w=>ctx.measureText(w).width);
    let rows=[[]],rowW=[0];const maxW=W*0.86;
    visible.forEach((w,i)=>{
      const ww=widths[i];
      if(rowW[rows.length-1]+ww+gap>maxW&&rows[rows.length-1].length>0){rows.push([]);rowW.push(0);}
      rows[rows.length-1].push({w,i,ww});
      rowW[rows.length-1]+=ww+gap;
    });
    const rowH=baseSz*1.4;
    const startY=cy-(rows.length-1)*rowH/2;
    rows.forEach((row,ri)=>{
      const totW=row.reduce((a,r)=>a+r.ww+gap,0)-gap;
      let x=cx-totW/2;
      const y=startY+ri*rowH;
      row.forEach(r=>{
        const isNew=r.i===shown-1;
        const wp=(inJap-(shown-1)*wordDur)/wordDur;
        const k=isNew?clamp(wp/0.4,0,1):1;
        ctx.save();
        const sz2=isNew?baseSz*1.25:baseSz*0.9;
        ctx.font=`${isNew?900:700} ${sz2}px 'Noto Sans Devanagari',serif`;
        ctx.fillStyle=isNew?P:gC(P,0.45);
        ctx.shadowColor=P;ctx.shadowBlur=isNew?40:10;
        ctx.globalAlpha=isNew?clamp(k*1.5,0,1):1;
        ctx.fillText(r.w,x+r.ww/2,y);
        ctx.restore();
        x+=r.ww+gap;
      });
    });
  }
  ctx.restore();
  ctx.filter='none';
}

function wrapText(text,x,y,maxW,lineH){
  const words=text.split(' ');let line='',lines=[];
  for(const w of words){const test=line+w+' ';if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w+' ';}else line=test;}
  lines.push(line);
  const startY=y-(lines.length-1)*lineH/2;
  lines.forEach((l,i)=>ctx.fillText(l.trim(),x,startY+i*lineH));
}

function drawRing(cx,cy,curN,total,inJap,P,S,t){
  const R=200;
  cy+=Math.sin(t*1.8)*8;
  ctx.save();
  ctx.strokeStyle=gC(P,0.16);ctx.lineWidth=22;
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
  const prog=(curN+inJap)/total;
  ctx.strokeStyle=P;ctx.lineWidth=22;ctx.lineCap='round';
  ctx.shadowColor=P;ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+prog*Math.PI*2);ctx.stroke();
  ctx.restore();
  const maxDots=Math.min(total,54);
  const step=total/maxDots;
  for(let i=0;i<maxDots;i++){
    const di=Math.floor(i*step);
    const a=(di/total)*Math.PI*2-Math.PI/2;
    const dx=cx+(R+52)*Math.cos(a),dy=cy+(R+52)*Math.sin(a);
    const lit=di<=curN;
    ctx.save();
    ctx.fillStyle=lit?P:gC(P,0.22);
    if(lit){ctx.shadowColor=P;ctx.shadowBlur=14;}
    ctx.beginPath();ctx.arc(dx,dy,lit?12:7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawCounterNumber(cx,cy,curN,total,inJap,P,t){
  cy+=Math.sin(t*1.8)*8;
  const f=fsz();
  const pop=inJap<0.15?1+(0.28*(1-inJap/0.15)):1;
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`900 ${f.counter*pop}px 'Noto Sans Devanagari',serif`;
  ctx.fillStyle=P;ctx.shadowColor=P;ctx.shadowBlur=30;
  ctx.fillText(curN,cx,cy-26);
  ctx.font=`400 46px 'Noto Sans Devanagari',serif`;
  ctx.fillStyle=gC(P,0.55);ctx.shadowBlur=0;
  ctx.fillText('/ '+total,cx,cy+f.counter*0.40);
  ctx.font=`400 28px 'Noto Sans Devanagari',serif`;
  ctx.fillStyle=gC(P,0.32);
  ctx.fillText(lang().jap,cx,cy+f.counter*0.40+52);
  ctx.restore();
}

function drawMala(cx,cy,malas,S){
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`700 38px 'Noto Sans Devanagari',serif`;
  ctx.fillStyle=S;ctx.shadowColor=S;ctx.shadowBlur=16;
  ctx.fillText(lang().mala+' × '+malas+' ✦',cx,cy);
  ctx.restore();
}

function drawWatermark(P){
  const pad=44;
  let x,y,anchor;
  if(sWmPos==='tl'){x=pad;y=pad+30;anchor='left';}
  else if(sWmPos==='tr'){x=W-pad;y=pad+30;anchor='right';}
  else if(sWmPos==='bl'){x=pad;y=H-190;anchor='left';}
  else{x=W-pad;y=H-190;anchor='right';}
  ctx.save();
  if(logoObj){
    const lh=66,lw=lh*(logoObj.width/logoObj.height);
    const lx=anchor==='right'?x-lw:x;
    ctx.globalAlpha=0.95;ctx.drawImage(logoObj,lx,y-lh/2,lw,lh);
  }else{
    ctx.textAlign=anchor;ctx.textBaseline='middle';
    ctx.font=`700 32px 'Noto Sans Devanagari',serif`;
    ctx.fillStyle=P;ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=8;
    ctx.fillText('🔯 विधि चक्र',x,y);
    ctx.font=`400 19px monospace`;ctx.fillStyle=gC(P,0.55);
    ctx.fillText('VIDHI CHAKRA',x,y+36);
  }
  ctx.restore();
}

function drawImgDots(idx,P){
  const n=sImages.length,gap=16;
  let widths=[];for(let i=0;i<n;i++)widths.push(i===idx?52:16);
  const totalW=widths.reduce((a,b)=>a+b,0)+(n-1)*gap;
  let x=(W-totalW)/2;const y=40;
  for(let i=0;i<n;i++){
    ctx.save();
    ctx.fillStyle=i===idx?P:gC(P,0.3);
    roundRect(x,y,widths[i],12,6);ctx.fill();
    x+=widths[i]+gap;
    ctx.restore();
  }
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function updateAndDrawPetals(t,P,S){
  if(playing&&Math.random()<0.35&&petals.length<28){
    petals.push({x:Math.random()*W,y:-30,vx:(Math.random()-0.5)*30,vy:90+Math.random()*70,rot:Math.random()*6,vr:(Math.random()-0.5)*3,size:15+Math.random()*11,color:Math.random()>0.5?gC(P,0.5):gC(S,0.45)});
  }
  const dt=1/60;
  petals.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;});
  petals=petals.filter(p=>p.y<H+40);
  petals.forEach(p=>{
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.ellipse(0,0,p.size*0.5,p.size*0.8,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

async function renderMp4(){
  if(typeof Mp4Muxer==='undefined'||!('VideoEncoder' in window)){
    alert("MP4 export needs iPhone Safari (iOS 16.4+) or desktop Chrome.\n\nAlternatively use your phone's screen recorder.");
    return;
  }
  const durSec=parseInt(el('exp-dur').value);
  const FPS=30;
  const totalFrames=durSec*FPS;
  el('exp-buttons').style.display='none';
  el('exp-status').style.display='block';
  const wasPetals=petals;petals=[]; // deterministic export: no random petals mid-render... actually keep simple
  try{
    const muxer=new Mp4Muxer.Muxer({
      target:new Mp4Muxer.ArrayBufferTarget(),
      video:{codec:'avc',width:W,height:H},
      fastStart:'in-memory'
    });
    const encoder=new VideoEncoder({
      output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
      error:e=>{console.log('enc err',e);}
    });
    encoder.configure({codec:'avc1.640028',width:W,height:H,bitrate:8000000,framerate:FPS});
    for(let i=0;i<totalFrames;i++){
      const t=i/FPS;
      drawFrame(t);
      const frame=new VideoFrame(el('cv'),{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      encoder.encode(frame,{keyFrame:i%30===0});
      frame.close();
      if(i%3===0){
        const pct=Math.round(i/totalFrames*100);
        el('exp-pct').textContent='Rendering... '+pct+'%';
        el('exp-bar').style.width=pct+'%';
        await new Promise(r=>setTimeout(r,0));
      }
    }
    el('exp-pct').textContent='Finalizing...';
    await encoder.flush();
    muxer.finalize();
    window._mp4Blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
    el('exp-status').style.display='none';
    el('exp-done').style.display='block';
  }catch(err){
    console.log(err);
    alert('Render failed: '+err.message+'\nTry shorter duration.');
    el('exp-status').style.display='none';
    el('exp-buttons').style.display='flex';
  }
  petals=wasPetals;
}

async function saveMp4(){
  if(!window._mp4Blob)return;
  const file=new File([window._mp4Blob],'mantra-jap-vidhichakra.mp4',{type:'video/mp4'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Mantra Jap'});}
    catch(e){if(e.name!=='AbortError')downloadBlob();}
  }else downloadBlob();
}
function downloadBlob(){
  const url=URL.createObjectURL(window._mp4Blob);
  const a=document.createElement('a');a.href=url;a.download='mantra-jap-vidhichakra.mp4';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

          ${anScanning
            ?`<div style="text-align:center;padding:22px;background:${gC(P,0.04)};border-radius:12px">
                <div style="color:${P};font-size:14px;font-weight:700">🔍 Scanning audio...</div>
                <div style="color:${gC(P,0.4)};font-size:11px;margin-top:5px">Finding the gap between mantras</div>
              </div>`
            :anDone
            ?`<div style="background:${gC(P,0.05)};border:1px solid ${gC(P,0.2)};border-radius:14px;padding:14px">
                <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
                  <div style="color:#4ade80;font-size:22px;font-weight:900">${sSyncPeriod.toFixed(2)}s</div>
                  <div style="color:${gC(P,0.55)};font-size:12px">between each mantra</div>
                </div>

                <canvas id="wave-cv" style="width:100%;height:110px;border-radius:8px;display:block;margin-bottom:6px"></canvas>
                <div style="color:${gC(P,0.35)};font-size:10px;line-height:1.5;margin-bottom:12px">
                  Green line = first mantra · gold lines = each following mantra.<br/>They should sit on the loud peaks. Nudge below if they're off.
                </div>

                ${anCandidates.length>1?`
                <div style="color:${gC(P,0.45)};font-size:10px;letter-spacing:2px;margin-bottom:6px">OTHER DETECTED RHYTHMS</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
                  ${anCandidates.map(c=>`<button onclick="pickCandidate(${c.sec})" style="border-radius:16px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:inherit;background:${Math.abs(c.sec-sSyncPeriod)<0.06?gC(P,0.2):'transparent'};color:${Math.abs(c.sec-sSyncPeriod)<0.06?P:gC(P,0.45)};border:1px solid ${Math.abs(c.sec-sSyncPeriod)<0.06?gC(P,0.5):gC(P,0.15)}">${c.sec.toFixed(2)}s</button>`).join('')}
                </div>`:''}

                <div style="color:${gC(P,0.45)};font-size:10px;letter-spacing:2px;margin-bottom:6px">FINE-TUNE GAP</div>
                <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px">
                  <button onclick="nudgePeriod(-0.1)" style="flex:1;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:13px;cursor:pointer;font-family:inherit">−0.1</button>
                  <button onclick="nudgePeriod(-0.01)" style="flex:1;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:13px;cursor:pointer;font-family:inherit">−0.01</button>
                  <div style="flex:1.4;text-align:center;color:${P};font-size:14px;font-weight:700">${sSyncPeriod.toFixed(2)}s</div>
                  <button onclick="nudgePeriod(0.01)" style="flex:1;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:13px;cursor:pointer;font-family:inherit">+0.01</button>
                  <button onclick="nudgePeriod(0.1)" style="flex:1;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:13px;cursor:pointer;font-family:inherit">+0.1</button>
                </div>

                <div style="color:${gC(P,0.45)};font-size:10px;letter-spacing:2px;margin-bottom:6px">START POINT — <span style="color:${P}">${sSyncOffset.toFixed(2)}s</span></div>
                <div style="display:flex;gap:6px;align-items:center;margin-bottom:14px">
                  <button onclick="nudgeOffset(-0.05)" style="flex:1;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:13px;cursor:pointer;font-family:inherit">−0.05</button>
                  <button onclick="nudgeOffset(0.05)" style="flex:1;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:13px;cursor:pointer;font-family:inherit">+0.05</button>
                  <button onclick="repickOffset()" style="flex:2;padding:9px 0;border-radius:8px;background:${gC(P,0.08)};color:${P};border:1px solid ${gC(P,0.25)};font-size:12px;cursor:pointer;font-family:inherit">🎯 Auto</button>
                </div>

                <button id="test-btn" onclick="testSync()" style="width:100%;padding:13px;border-radius:12px;background:${gC(P,0.12)};color:${P};border:1px solid ${gC(P,0.4)};font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px">🔊 Test sync (audio + click)</button>
                <div style="color:${gC(P,0.35)};font-size:11px;line-height:1.5;text-align:center">If each click lands exactly on the mantra, you're locked in.</div>

                <div style="border-top:1px solid ${gC(P,0.1)};margin-top:14px;padding-top:12px">
                  <div style="color:${gC(P,0.4)};font-size:10px;letter-spacing:2px;margin-bottom:7px">STILL OFF? TAP IT YOURSELF</div>
                  <div style="display:flex;gap:6px">
                    <button id="tap-btn" onclick="tapBeat()" style="flex:3;padding:11px;border-radius:10px;background:${gC(P,0.08)};color:${P};border:1px dashed ${gC(P,0.3)};font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">👆 Tap on each mantra</button>
                    <button onclick="resetTaps()" style="flex:1;padding:11px;border-radius:10px;background:transparent;color:${gC(P,0.45)};border:1px solid ${gC(P,0.15)};font-size:12px;cursor:pointer;font-family:inherit">Reset</button>
                  </div>
                </div>
              </div>`
            :`<button onclick="scanAudio()" style="width:100%;padding:14px;border-radius:12px;background:${gC(P,0.12)};color:${P};border:1px solid ${gC(P,0.4)};font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">🔍 Scan audio for mantra rhythm</button>`}
        `}
      <input type="file" id="file-audio" accept="audio/*" style="display:none" onchange="handleAudioFile(this)"/>
    </div>

    <div>
      <label class="field-label" style="color:${PL}">${L.images}</label>
      <div class="upload-zone" style="border:1px dashed ${gC(P,0.28)};background:${gC(P,0.02)};margin-bottom:${sImages.length?12:0}px" onclick="el('file-imgs').click()"><div style="font-size:24px;margin-bottom:5px">🖼️</div><div style="color:${gC(P,0.5)};font-size:13px">${L.imageHint}</div><div style="color:${gC(P,0.25)};font-size:11px;margin-top:3px">JPG · PNG · WEBP</div></div>
      <input type="file" id="file-imgs" accept="image/*" multiple style="display:none" onchange="addImages(this)"/>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${sImages.length?8:0}px">
        ${sImages.map((src,i)=>`<div class="img-thumb" style="border:1px solid ${gC(P,0.3)}"><img src="${src}" alt=""/><div class="del-btn" onclick="removeImg(${i})">✕</div><div style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:${gC(P,0.8)}">${i+1}</div></div>`).join('')}
        ${sImages.length?`<div class="add-btn" style="border-color:${gC(P,0.25)};color:${gC(P,0.4)}" onclick="el('file-imgs').click()">+</div>`:''}
      </div>
      ${sImages.length>0?`<div style="margin-top:6px">
        <div style="color:${PL};font-size:10px;letter-spacing:3px;margin-bottom:8px">${L.photoFx}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${PHOTO_FX.map(pf=>`<button onclick="sPhotoFx='${pf.id}';renderSetup()" style="border-radius:18px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;background:${sPhotoFx===pf.id?gC(P,0.18):'transparent'};color:${sPhotoFx===pf.id?P:gC(P,0.45)};border:1px solid ${sPhotoFx===pf.id?gC(P,0.55):gC(P,0.15)}">${pf.label}</button>`).join('')}</div>
      </div>`:''}
      ${sImages.length>1?`<div style="margin-top:12px">
        <div style="color:${PL};font-size:10px;letter-spacing:3px;margin-bottom:6px">${L.imgSpeed} — <span id="imgint-lbl" style="color:${P}">${sImgInt}s</span></div>
        <input type="range" min="3" max="30" step="1" value="${sImgInt}" oninput="sImgInt=+this.value;el('imgint-lbl').textContent=sImgInt+'s'" style="accent-color:${P}"/>
      </div>`:''}
    </div>

    <div style="border-top:1px solid ${gC(P,0.1)};padding-top:18px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;color:${P};font-size:13px;font-weight:700;letter-spacing:1px">🔯 विधि चक्र Watermark</div>
      <label class="field-label" style="color:${PL}">${L.logo}</label>
      <div class="wm-zone" style="border:1px dashed ${gC(P,0.28)};background:${gC(P,0.02)};padding:${sLogoSrc?0:16}px ${sLogoSrc?0:14}px;margin-bottom:10px" onclick="el('file-logo').click()">
        ${sLogoSrc?`<div style="position:relative"><img src="${sLogoSrc}" style="height:56px;object-fit:contain;display:block;margin:12px auto"/><div style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.7);border-radius:12px;padding:2px 10px;color:${gC(P,0.75)};font-size:10px">tap to change</div></div>`:`<div style="font-size:22px;margin-bottom:5px">🔯</div><div style="color:${gC(P,0.45)};font-size:12px">${L.logoHint}</div><div style="color:${PM};font-size:11px;margin-top:6px;border:1px solid ${PD};border-radius:20px;padding:5px 12px;display:inline-block">or use default text badge</div>`}
      </div>
      <input type="file" id="file-logo" accept="image/*" style="display:none" onchange="setLogo(this)"/>
      <label class="field-label" style="color:${PL};margin-top:10px">${L.wmPos}</label>
      <div style="display:flex;gap:8px">${WM_POS.map(p=>`<button onclick="sWmPos='${p.id}';renderSetup()" style="flex:1;padding:8px 0;border-radius:10px;background:${sWmPos===p.id?gC(P,0.18):'transparent'};color:${sWmPos===p.id?P:gC(P,0.4)};border:1px solid ${sWmPos===p.id?gC(P,0.55):gC(P,0.15)};font-size:16px;cursor:pointer">${p.label}</button>`).join('')}</div>
    </div>

    <div>
      <label class="field-label" style="color:${PL}">${L.count}</label>
      <div style="display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap">${[11,21,51,108].map(n=>`<button class="count-btn" onclick="setCount(${n})" style="color:${sCount===n&&!sCustom?P:gC(P,0.4)};border:1px solid ${sCount===n&&!sCustom?gC(P,0.55):gC(P,0.15)};background:${sCount===n&&!sCustom?gC(P,0.18):'transparent'}">${n}</button>`).join('')}</div>
      <input class="inp" type="number" value="${sCustom}" placeholder="${L.custom}" oninput="sCustom=this.value" onchange="renderSetup()" style="background:${FG};border:1px solid ${DG};color:${P};font-size:15px"/>
    </div>

    <div>
      <label class="field-label" style="color:${PL}">${L.japSpeed} — <span id="speed-lbl" style="color:${P}">${audioSynced?sSyncPeriod.toFixed(2):sSpeed}s per jap</span>${audioSynced?` <span style="background:rgba(74,222,128,0.12);color:#4ade80;padding:2px 8px;border-radius:8px;font-size:9px;margin-left:6px">🎵 LOCKED TO AUDIO</span>`:''}</label>
      ${audioSynced
        ?`<div style="color:${gC(P,0.45)};font-size:12px;line-height:1.6;padding:10px;background:${gC(P,0.04)};border-radius:10px">Locked to the rhythm found in your audio (${sSyncPeriod.toFixed(2)}s, starting at ${sSyncOffset.toFixed(2)}s). Adjust it in the Audio Sync Scanner above.</div>`
        :`<input type="range" min="1" max="20" step="0.5" value="${sSpeed}" oninput="sSpeed=+this.value;el('speed-lbl').textContent=sSpeed+'s per jap'" style="accent-color:${P}"/>
      <div style="display:flex;justify-content:space-between;color:${PM};font-size:11px;margin-top:4px"><span>⚡1s</span><span>🕉20s</span></div>
      ${sMantra.trim()?`<button onclick="sSpeed=${estSec};renderSetup()" style="width:100%;margin-top:10px;padding:11px;background:${gC(P,0.1)};border:1px solid ${gC(P,0.35)};border-radius:10px;color:${P};font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">🧠 ${L.smartDetect}: ${estSec}s <span style="color:${gC(P,0.5)};font-weight:400">(from mantra length)</span></button>`:''}`}
    </div>

    <div class="option-row">
      <div><div style="color:${gC(P,0.5)};font-size:10px;letter-spacing:3px">${L.autoStart}</div><div style="color:${gC(P,0.25)};font-size:11px;margin-top:3px">${L.autoHint}</div></div>
      <div class="toggle-track" style="background:${sAuto?gC(P,0.3):gC(P,0.08)};border:1px solid ${sAuto?gC(P,0.6):gC(P,0.2)}" onclick="sAuto=!sAuto;renderSetup()"><div class="toggle-thumb" style="left:${sAuto?23:3}px;background:${sAuto?P:'rgba(255,255,255,0.2)'};box-shadow:${sAuto?`0 0 8px ${gC(P,0.8)}`:'none'}"></div></div>
    </div>

    <div style="background:${gC(P,0.06)};border:1px solid ${gC(P,0.18)};border-radius:12px;padding:14px">
      <div style="color:${P};font-size:13px;font-weight:700;margin-bottom:6px">📱 Save as video</div>
      <div style="color:${gC(P,0.55)};font-size:12px;line-height:1.7">
        <strong style="color:${P}">With audio:</strong> preview → iPhone Screen Record → stop → MP4 in Photos<br/>
        <strong style="color:${P}">Video only:</strong> tap ⬇ Save MP4 on the preview → renders true MP4 → Save to Photos
      </div>
    </div>

    <div style="display:flex;gap:10px">
      <button onclick="savePreset()" ${!sMantra.trim()?'disabled':''} style="flex:1;background:transparent;color:${sMantra.trim()?P:gC(P,0.2)};border:1px solid ${sMantra.trim()?gC(P,0.4):gC(P,0.1)};border-radius:40px;padding:14px;font-size:14px;font-weight:700;cursor:${sMantra.trim()?'pointer':'not-allowed'};font-family:inherit;letter-spacing:1px">💾 ${L.save}</button>
    </div>

    <button class="go-btn" onclick="startPlayer()" style="background:${sMantra.trim()?`linear-gradient(135deg,${dC(P)},${P},${dC(P)})`:'rgba(255,255,255,0.06)'};color:${sMantra.trim()?'#0d0800':'rgba(255,255,255,0.2)'};cursor:${sMantra.trim()?'pointer':'not-allowed'};box-shadow:${sMantra.trim()?`0 0 40px ${gC(P,0.3)}`:'none'}">${sMantra.trim()?'▶ '+L.start:L.enterMantra}</button>
  </div>`;

  syncGoButtons();
  if(anDone&&anEnv)requestAnimationFrame(()=>drawWaveform());
}

function syncGoButtons(){
  const P=theme().p,L=lang();
  const has=sMantra.trim().length>0;
  const sb=el('sticky-bar'),sbtn=el('sticky-go');
  sb.style.display='flex';
  sbtn.textContent=has?'▶ '+L.start:L.enterMantra;
  sbtn.style.background=has?`linear-gradient(135deg,${dC(P)},${P},${dC(P)})`:'rgba(120,120,120,0.5)';
  sbtn.style.color=has?'#0d0800':'rgba(255,255,255,0.5)';
  sbtn.style.cursor=has?'pointer':'not-allowed';
  sbtn.style.boxShadow=has?`0 0 30px ${gC(P,0.4)}`:'none';
}

function setLang(l){sLang=l;renderSetup();}
function setTheme(id){sThemeId=id;renderSetup();}
function setCustomClr(v){sCustomClr=v;renderSetup();}
function setTextMode(m){sTextMode=m;renderSetup();}
function setTextFx(f){sTextFx=f;renderSetup();}
function setFontSize(s){sFontSize=s;renderSetup();}
function setCount(n){sCount=n;sCustom='';renderSetup();}
function setPresetByIndex(i){const p=PRESETS[i];if(!p)return;sMantra=p.mantra;const ta=el('inp-mantra');if(ta)ta.value=p.mantra;renderSetup();}

renderSetup();

</script>
</body>
</html>
